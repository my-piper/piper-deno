version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  # Bumps the pinned Deno base image; CI reads the version from the Dockerfile.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
